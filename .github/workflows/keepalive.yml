name: keepalive

on:
  schedule:
    # Une fois par semaine : GitHub desactive les workflows planifies d'un
    # depot public sans activite depuis 60 jours. Un commit hebdomadaire
    # garantit que la surveillance ne s'eteint jamais d'elle-meme.
    - cron: '5 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Horodater
        run: date -u '+%Y-%m-%d %H:%M UTC' > keepalive.txt
      - name: Commit
        run: |
          git config user.name 'mon-box watchdog'
          git config user.email 'watchdog@users.noreply.github.com'
          git add keepalive.txt
          git diff --staged --quiet || git commit -m 'keepalive [skip ci]'
          git push
