name: watchdog

on:
  schedule:
    # toutes les 15 min : on surveille le surveillant
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: watchdog
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  surveiller:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Interroger mon-box (2 tentatives a 30 s d'intervalle)
        id: probe
        env:
          MONITOR_URL: ${{ secrets.MONITOR_URL }}
          HB_TOKEN: ${{ secrets.HB_TOKEN }}
        run: |
          set -u
          url="${MONITOR_URL%/}/?format=json&token=${HB_TOKEN}"
          for i in 1 2; do
            if body=$(curl -fsS -m 20 "$url"); then
              echo "mon-box repond (tentative $i)"
              echo "$body" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("etat:", [(x["id"], x["state"]) for x in d["devices"]], [(c["id"], c["state"]) for c in d["checks"]])'
              exit 0
            fi
            echo "::warning::tentative $i echouee"
            [ "$i" = 1 ] && sleep 30
          done
          echo "mon-box ne repond plus apres 2 tentatives"
          exit 1

      - name: Alerter par mail
        if: failure()
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          MONITOR_URL: ${{ secrets.MONITOR_URL }}
        run: python3 scripts/alert.py

  # Un depot public sans activite perd ses workflows planifies au bout de 60 j.
  # Un commit hebdomadaire garantit que la surveillance ne s'eteint jamais toute seule.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mettre a jour keepalive.txt
        env:
          JOUR: ${{ github.run_id }}
        run: |
          date -u '+%Y-%m-%d %H:%M UTC' > keepalive.txt
      - name: Commit
        run: |
          git config user.name 'mon-box watchdog'
          git config user.email 'watchdog@users.noreply.github.com'
          git add keepalive.txt
          git diff --staged --quiet || git commit -m 'keepalive [skip ci]'
          git push
